[env:sensor_demo]
extends = env:nanoatmega328new
build_src_filter = +<*> -<main.cpp> +<../test/sensors/ir_array.cpp>

[env:motor_test]
extends = env:nanoatmega328new
build_src_filter = +<*> -<main.cpp> +<../test/motors/test_motors.cpp>